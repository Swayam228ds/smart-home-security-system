<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Security — Audio Test Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2236;
            --bg-card-hover: #1f2a42;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #1e293b;
            --border-active: #334155;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Background gradient effect */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(16, 185, 129, 0.04) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Status bar */
        .status-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .status-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status-dot.active { background: var(--accent-green); box-shadow: 0 0 6px rgba(16, 185, 129, 0.5); }
        .status-dot.error { background: var(--accent-red); }
        .status-dot.warning { background: var(--accent-amber); }

        /* Main grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 700px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            transition: border-color 0.2s;
        }

        .card:hover { border-color: var(--border-active); }

        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        /* Mic Section */
        .mic-section {
            grid-column: 1 / -1;
            text-align: center;
            padding: 32px;
        }

        .mic-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--accent);
            background: rgba(59, 130, 246, 0.1);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            position: relative;
        }

        .mic-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: scale(1.05);
        }

        .mic-btn.recording {
            border-color: var(--accent-red);
            background: rgba(239, 68, 68, 0.15);
            animation: pulse-ring 1.5s infinite;
        }

        .mic-btn.processing {
            border-color: var(--accent-amber);
            background: rgba(245, 158, 11, 0.1);
            cursor: wait;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .mic-icon {
            width: 36px;
            height: 36px;
            fill: currentColor;
            color: var(--accent);
        }

        .mic-btn.recording .mic-icon { color: var(--accent-red); }
        .mic-btn.processing .mic-icon { color: var(--accent-amber); }

        .mic-label {
            margin-top: 14px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .mic-hint {
            margin-top: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Text input alternative */
        .text-input-section {
            grid-column: 1 / -1;
        }

        .text-input-row {
            display: flex;
            gap: 10px;
        }

        .text-input {
            flex: 1;
            padding: 10px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .text-input:focus { border-color: var(--accent); }
        .text-input::placeholder { color: var(--text-muted); }

        .send-btn {
            padding: 10px 20px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .send-btn:hover { opacity: 0.85; }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Chat log */
        .chat-section {
            grid-column: 1 / -1;
            max-height: 400px;
            overflow-y: auto;
        }

        .chat-log {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .chat-msg.visitor { flex-direction: row-reverse; }

        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .chat-msg.assistant .chat-avatar {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent);
        }

        .chat-msg.visitor .chat-avatar {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
        }

        .chat-msg.system .chat-avatar {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-amber);
        }

        .chat-bubble {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.5;
            max-width: 75%;
        }

        .chat-msg.assistant .chat-bubble {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.15);
            color: var(--text-primary);
        }

        .chat-msg.visitor .chat-bubble {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.15);
            color: var(--text-primary);
        }

        .chat-msg.system .chat-bubble {
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.12);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-style: italic;
            max-width: 100%;
        }

        .chat-time {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Audio player */
        .audio-player {
            margin-top: 8px;
        }

        .audio-player audio {
            height: 32px;
            width: 100%;
            border-radius: 6px;
        }

        /* Session info panel */
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-muted); }
        .info-value { color: var(--text-primary); font-weight: 500; }

        .state-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
        }

        /* Buttons row */
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .btn-sm {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
        .btn-sm.danger:hover { border-color: var(--accent-red); color: var(--accent-red); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 3px; }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-active);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🏠 Home Security — Audio Console</h1>
            <p>Test the visitor conversation pipeline</p>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-chip">
                <span class="status-dot" id="dot-server"></span>
                <span id="status-server">Connecting...</span>
            </div>
            <div class="status-chip">
                <span class="status-dot" id="dot-session"></span>
                <span id="status-session">No session</span>
            </div>
            <div class="status-chip">
                <span class="status-dot" id="dot-mic"></span>
                <span id="status-mic">Mic: off</span>
            </div>
        </div>

        <div class="main-grid">
            <!-- Microphone Button -->
            <div class="card mic-section">
                <button class="mic-btn" id="mic-btn" onclick="toggleRecording()">
                    <svg class="mic-icon" viewBox="0 0 24 24" id="mic-icon-svg">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <div class="mic-label" id="mic-label">Click to start recording</div>
                <div style="margin-top: 15px;">
                    <select id="mic-selector" class="text-input" style="width: auto; padding: 5px; cursor: pointer;">
                        <option value="laptop">Laptop Mic</option>
                        <option value="esp32">ESP32 Mic (USB Serial)</option>
                    </select>
                </div>
                <div class="mic-hint" style="margin-top: 10px;">Or type a message below</div>
            </div>

            <!-- Text Input -->
            <div class="card text-input-section">
                <div class="card-title">Text Input (bypass mic)</div>
                <div class="text-input-row">
                    <input type="text" class="text-input" id="text-input"
                           placeholder="Type what the visitor says..."
                           onkeydown="if(event.key==='Enter') sendText()">
                    <button class="send-btn" id="send-btn" onclick="sendText()">Send</button>
                </div>
            </div>

            <!-- Chat Log -->
            <div class="card chat-section">
                <div class="card-title">Conversation</div>
                <div class="chat-log" id="chat-log">
                    <div class="empty-state" id="empty-state">
                        Start a session to begin the conversation
                    </div>
                </div>
            </div>

            <!-- Session Info -->
            <div class="card">
                <div class="card-title">Session Info</div>
                <div class="info-row">
                    <span class="info-label">State</span>
                    <span class="state-badge" id="info-state">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Visitor</span>
                    <span class="info-value" id="info-visitor">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Purpose</span>
                    <span class="info-value" id="info-purpose">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Messages</span>
                    <span class="info-value" id="info-messages">0</span>
                </div>

                <div class="btn-row">
                    <button class="btn-sm" onclick="startSession()">New Session</button>
                    <button class="btn-sm danger" onclick="endSession()">End Session</button>
                    <button class="btn-sm" onclick="refreshStatus()">Refresh</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = '';  // Same origin

        // ─── State ─────────────────────────────────────
        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let sessionActive = false;

        // ─── Init ──────────────────────────────────────
        document.addEventListener('DOMContentLoaded', async () => {
            await checkHealth();
            await refreshStatus();
        });

        // ─── Health Check ──────────────────────────────
        async function checkHealth() {
            try {
                const res = await fetch(`${API}/api/health`);
                const data = await res.json();
                setDot('dot-server', 'active');
                document.getElementById('status-server').textContent = 'Server online';
            } catch (e) {
                setDot('dot-server', 'error');
                document.getElementById('status-server').textContent = 'Server offline';
            }
        }

        // ─── Session Management ────────────────────────
        async function startSession() {
            try {
                // First start the session via JSON
                const res = await fetch(`${API}/api/sessions`, { method: 'POST' });
                const data = await res.json();
                sessionActive = true;
                setDot('dot-session', 'active');
                document.getElementById('status-session').textContent = `Session active`;
                clearChat();
                addSystemMsg('New session started. The assistant will greet the visitor.');

                // Now fetch the audio greeting
                // Send an empty wav file to trigger the audio response logic
                const emptyAudio = new Blob([], { type: 'audio/wav' });
                const formData = new FormData();
                formData.append('file', emptyAudio, 'empty.wav');
                
                const audioRes = await fetch(`${API}/api/test/audio`, {
                    method: 'POST',
                    body: formData
                });
                
                if (audioRes.ok) {
                    const audioBlob = await audioRes.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audioEl = new Audio(audioUrl);
                    audioEl.play();
                }

                await sendTextDirect('');
                await refreshStatus();
            } catch (e) {
                addSystemMsg('Failed to start session: ' + e.message);
            }
        }

        async function endSession() {
            try {
                await fetch(`${API}/api/sessions`, { method: 'DELETE' });
                sessionActive = false;
                setDot('dot-session', '');
                document.getElementById('status-session').textContent = 'No session';
                addSystemMsg('Session ended.');
                await refreshStatus();
            } catch (e) {
                addSystemMsg('Failed to end session: ' + e.message);
            }
        }

        async function refreshStatus() {
            try {
                const res = await fetch(`${API}/api/sessions`);
                const data = await res.json();
                sessionActive = data.active;

                document.getElementById('info-state').textContent = data.state || '—';
                document.getElementById('info-visitor').textContent = data.visitor_name || '—';
                document.getElementById('info-purpose').textContent = data.visitor_purpose || '—';
                document.getElementById('info-messages').textContent = data.message_count || '0';

                if (data.active) {
                    setDot('dot-session', 'active');
                    document.getElementById('status-session').textContent = 'Session active';
                } else {
                    setDot('dot-session', '');
                    document.getElementById('status-session').textContent = 'No session';
                }
            } catch (e) { /* ignore */ }
        }

        // ─── Text Input ───────────────────────────────
        async function sendText() {
            const input = document.getElementById('text-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';

            if (!sessionActive) {
                await startSession();
                // Wait a tiny bit for the greeting to process
                await new Promise(r => setTimeout(r, 500));
            }

            await sendTextDirect(text);
        }

        async function sendTextDirect(text) {
            if (text) {
                addVisitorMsg(text);
            }

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;

            try {
                const res = await fetch(`${API}/api/test/text?text=${encodeURIComponent(text)}`, {
                    method: 'POST'
                });
                const data = await res.json();

                if (data.response_text) {
                    addAssistantMsg(data.response_text);
                }

                await refreshStatus();
            } catch (e) {
                addSystemMsg('Error: ' + e.message);
            } finally {
                sendBtn.disabled = false;
            }
        }

        // ─── Microphone Recording ──────────────────────
        async function toggleRecording() {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        }

        async function startRecording() {
            try {
                const micType = document.getElementById('mic-selector').value;
                if (micType === 'esp32') {
                    // Start ESP32 UDP recording on the backend
                    await fetch(`${API}/api/test/esp32/start`, { method: 'POST' });
                    isRecording = true;
                    
                    const btn = document.getElementById('mic-btn');
                    btn.classList.add('recording');
                    document.getElementById('mic-label').textContent = 'Recording from ESP32... Click to stop';
                    setDot('dot-mic', 'active');
                    document.getElementById('status-mic').textContent = 'Mic: ESP32 active';
                    return;
                }

                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                    }
                });

                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'audio/webm;codecs=opus'
                });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    await processRecordedAudio();
                };

                mediaRecorder.start(100); // collect in 100ms chunks
                isRecording = true;

                const btn = document.getElementById('mic-btn');
                btn.classList.add('recording');
                document.getElementById('mic-label').textContent = 'Recording... Click to stop';
                setDot('dot-mic', 'active');
                document.getElementById('status-mic').textContent = 'Mic: recording';
            } catch (e) {
                addSystemMsg('Microphone access denied: ' + e.message);
                setDot('dot-mic', 'error');
                document.getElementById('status-mic').textContent = 'Mic: denied';
            }
        }

        async function stopRecording() {
            const micType = document.getElementById('mic-selector').value;
            
            if (micType === 'esp32') {
                isRecording = false;
                const btn = document.getElementById('mic-btn');
                btn.classList.remove('recording');
                btn.classList.add('processing');
                document.getElementById('mic-label').textContent = 'Processing ESP32 Audio...';
                setDot('dot-mic', 'warning');
                document.getElementById('status-mic').textContent = 'Mic: processing';
                
                // Fetch the recorded audio and process it
                await processEsp32Audio();
                return;
            }

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;

            const btn = document.getElementById('mic-btn');
            btn.classList.remove('recording');
            btn.classList.add('processing');
            document.getElementById('mic-label').textContent = 'Processing...';
            setDot('dot-mic', 'warning');
            document.getElementById('status-mic').textContent = 'Mic: processing';
        }

        async function processRecordedAudio() {
            if (!sessionActive) {
                await startSession();
                await new Promise(r => setTimeout(r, 500));
            }

            try {
                // Convert webm to wav using AudioContext
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const arrayBuffer = await audioBlob.arrayBuffer();
                const audioCtx = new AudioContext({ sampleRate: 16000 });
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                // Convert to 16-bit PCM WAV
                const wavBlob = audioBufferToWav(audioBuffer);

                // Upload to server
                const formData = new FormData();
                formData.append('file', wavBlob, 'recording.wav');

                const res = await fetch(`${API}/api/test/audio`, {
                    method: 'POST',
                    body: formData,
                });

                if (res.ok) {
                    const transcript = res.headers.get('X-Transcript');
                    if (transcript) {
                        addVisitorMsg('🎙 ' + transcript);
                    } else {
                        addVisitorMsg('🎙 [Audio message sent]');
                    }

                    const audioResponseBlob = await res.blob();
                    const audioUrl = URL.createObjectURL(audioResponseBlob);
                    addAssistantMsgWithAudio('', audioUrl);

                    // Auto-play response
                    const audio = new Audio(audioUrl);
                    audio.play().catch(() => {});
                } else {
                    const errText = await res.text();
                    addSystemMsg('Server error: ' + errText);
                }

                await refreshStatus();
            } catch (e) {
                addSystemMsg('Error processing audio: ' + e.message);
            } finally {
                const btn = document.getElementById('mic-btn');
                btn.classList.remove('processing');
                document.getElementById('mic-label').textContent = 'Click to start recording';
                setDot('dot-mic', '');
                document.getElementById('status-mic').textContent = 'Mic: off';
            }
        }

        async function processEsp32Audio() {
            try {
                const res = await fetch(`${API}/api/test/esp32/stop`, {
                    method: 'POST',
                });

                if (res.ok) {
                    const transcript = res.headers.get('X-Transcript');
                    if (transcript) {
                        addVisitorMsg('🎙 ' + transcript);
                    } else {
                        addVisitorMsg('🎙 [Audio from ESP32]');
                    }

                    const audioResponseBlob = await res.blob();
                    const audioUrl = URL.createObjectURL(audioResponseBlob);
                    addAssistantMsgWithAudio('', audioUrl);

                    // Auto-play response
                    const audio = new Audio(audioUrl);
                    audio.play().catch(() => {});
                } else {
                    const errText = await res.text();
                    addSystemMsg('Server error: ' + errText);
                }

                await refreshStatus();
            } catch (e) {
                addSystemMsg('Error processing ESP32 audio: ' + e.message);
            } finally {
                const btn = document.getElementById('mic-btn');
                btn.classList.remove('processing');
                document.getElementById('mic-label').textContent = 'Click to start recording';
                setDot('dot-mic', '');
                document.getElementById('status-mic').textContent = 'Mic: off';
            }
        }

        // ─── WAV Encoder ───────────────────────────────
        function audioBufferToWav(buffer) {
            const numChannels = 1;
            const sampleRate = buffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;
            const data = buffer.getChannelData(0);
            const dataLength = data.length * (bitDepth / 8);
            const headerLength = 44;
            const totalLength = headerLength + dataLength;

            const arrayBuffer = new ArrayBuffer(totalLength);
            const view = new DataView(arrayBuffer);

            // WAV header
            writeString(view, 0, 'RIFF');
            view.setUint32(4, totalLength - 8, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
            view.setUint16(32, numChannels * (bitDepth / 8), true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);

            // Write samples
            let offset = 44;
            for (let i = 0; i < data.length; i++) {
                const sample = Math.max(-1, Math.min(1, data[i]));
                view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                offset += 2;
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, str) {
            for (let i = 0; i < str.length; i++) {
                view.setUint8(offset + i, str.charCodeAt(i));
            }
        }

        // ─── Chat UI ───────────────────────────────────
        function clearChat() {
            const log = document.getElementById('chat-log');
            log.innerHTML = '';
        }

        function addVisitorMsg(text) {
            removeEmptyState();
            const log = document.getElementById('chat-log');
            log.innerHTML += `
                <div class="chat-msg visitor">
                    <div class="chat-avatar">👤</div>
                    <div>
                        <div class="chat-bubble">${escapeHtml(text)}</div>
                        <div class="chat-time">${timeNow()}</div>
                    </div>
                </div>`;
            log.scrollTop = log.scrollHeight;
        }

        function addAssistantMsg(text) {
            removeEmptyState();
            const log = document.getElementById('chat-log');
            log.innerHTML += `
                <div class="chat-msg assistant">
                    <div class="chat-avatar">🛡</div>
                    <div>
                        <div class="chat-bubble">${escapeHtml(text)}</div>
                        <div class="chat-time">${timeNow()}</div>
                    </div>
                </div>`;
            log.scrollTop = log.scrollHeight;
        }

        function addAssistantMsgWithAudio(text, audioUrl) {
            removeEmptyState();
            const log = document.getElementById('chat-log');
            log.innerHTML += `
                <div class="chat-msg assistant">
                    <div class="chat-avatar">🛡</div>
                    <div>
                        ${text ? `<div class="chat-bubble">${escapeHtml(text)}</div>` : ''}
                        <div class="audio-player">
                            <audio controls src="${audioUrl}"></audio>
                        </div>
                        <div class="chat-time">${timeNow()}</div>
                    </div>
                </div>`;
            log.scrollTop = log.scrollHeight;
        }

        function addSystemMsg(text) {
            removeEmptyState();
            const log = document.getElementById('chat-log');
            log.innerHTML += `
                <div class="chat-msg system">
                    <div class="chat-avatar">⚙</div>
                    <div class="chat-bubble">${escapeHtml(text)}</div>
                </div>`;
            log.scrollTop = log.scrollHeight;
        }

        function removeEmptyState() {
            const el = document.getElementById('empty-state');
            if (el) el.remove();
        }

        // ─── Helpers ───────────────────────────────────
        function setDot(id, cls) {
            const dot = document.getElementById(id);
            dot.className = 'status-dot' + (cls ? ' ' + cls : '');
        }

        function timeNow() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
